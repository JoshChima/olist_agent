name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Never run two applies against the same state at once. Queue them; don't cancel a running apply halfway.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      ARM_USE_OIDC: "true"
      # Secrets, not vars: GitHub masks secrets in logs, and this repo's logs are public.
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID_DEPLOY }} # only trusted for refs/heads/main
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_budget_alert_email: ${{ secrets.BUDGET_ALERT_EMAIL }}
      TF_VAR_operator_object_id: ${{ secrets.AZURE_OPERATOR_OBJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false

      # 1. Infrastructure first: on the very first run this creates the ACR that step 2 pushes to.
      - run: terraform -chdir=infra init -input=false -backend-config=storage_account_name=${{ secrets.TFSTATE_STORAGE_ACCOUNT }}
      # Redacted and checked by scripts/redact.py before it reaches the log, as in CI's plan step.
      # If redaction missed an ID, the apply has still happened but the job stops before the deploy.
      - run: |
          rc=0
          terraform -chdir=infra apply -auto-approve -input=false > apply.txt 2>&1 || rc=$?
          python3 scripts/redact.py < apply.txt || rc=1
          rm apply.txt
          exit "$rc"
      # The config must converge: a plan right after apply has to be empty (exit 0). Exit 2 is
      # drift Azure introduced at create, like the Postgres zone (#20), caught in this deploy
      # instead of failing the next one's apply.
      - name: plan after apply is empty
        run: |
          rc=0
          terraform -chdir=infra plan -detailed-exitcode -input=false -no-color > plan.txt 2>&1 || rc=$?
          python3 scripts/redact.py < plan.txt || rc=1
          rm plan.txt
          if [ "$rc" = 2 ]; then echo "::error::plan after apply is not empty: the config doesn't converge"; fi
          exit "$rc"
      - name: read outputs
        id: tf
        run: |
          for o in resource_group acr_name acr_login_server container_app_name loader_job_name app_url; do
            echo "$o=$(terraform -chdir=infra output -raw $o)" >> "$GITHUB_OUTPUT"
          done

      # 2. Build and push. The image is tagged with the commit SHA (never :latest),
      # so every revision maps back to a commit and a rollback is a re-deploy of an old tag.
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_DEPLOY }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: build and push
        env:
          IMAGE: ${{ steps.tf.outputs.acr_login_server }}/olist-agent:${{ github.sha }}
        run: |
          az acr login --name ${{ steps.tf.outputs.acr_name }}
          docker build --build-arg GIT_SHA=${{ github.sha }} -t "$IMAGE" app
          docker push "$IMAGE"

      # 3. Point the app at the new image. This creates a new revision; with
      # revision_mode Single, traffic moves once the new revision is up.
      - name: update container app
        # --output none: the default JSON dump carries identity IDs and outbound IPs into the public log.
        run: |
          az containerapp update --output none \
            --name ${{ steps.tf.outputs.container_app_name }} \
            --resource-group ${{ steps.tf.outputs.resource_group }} \
            --image ${{ steps.tf.outputs.acr_login_server }}/olist-agent:${{ github.sha }}

      # 4. Load. The loader job runs the same image: migrations, the app's database role,
      # and olist.sqlite from Blob if one was uploaded. It exits 0 with "no source data"
      # until then. Its output goes to Log Analytics, not here: it would carry Azure IDs.
      - name: run loader
        env:
          JOB: ${{ steps.tf.outputs.loader_job_name }}
          RG: ${{ steps.tf.outputs.resource_group }}
        # --query/--output none throughout: start and show return the job's resource ID.
        run: |
          az containerapp job update --output none --name "$JOB" --resource-group "$RG" \
            --image ${{ steps.tf.outputs.acr_login_server }}/olist-agent:${{ github.sha }}
          run=$(az containerapp job start --name "$JOB" --resource-group "$RG" --query name -o tsv)
          for i in $(seq 90); do
            status=$(az containerapp job execution show --name "$JOB" --resource-group "$RG" \
              --job-execution-name "$run" --query properties.status -o tsv)
            case "$status" in
            Succeeded) echo "loader: $status"; exit 0 ;;
            Failed | Stopped | Degraded)
              echo "loader: $status. Its logs are in Log Analytics (ContainerAppConsoleLogs_CL)."
              exit 1 ;;
            esac
            echo "attempt $i: ${status:-no status yet}, waiting"; sleep 20
          done
          echo "loader: still not done after 30 minutes"
          exit 1

      # 5. Smoke test. "200 OK" isn't enough: the old revision would also return it.
      # Wait until /health reports this commit's SHA. Retries cover scale-from-zero cold starts.
      - name: smoke test
        run: |
          url="${{ steps.tf.outputs.app_url }}/health"
          for i in $(seq 30); do
            v=$(curl -fsS --max-time 10 "$url" | jq -r .version) && [ "$v" = "${{ github.sha }}" ] && { echo "live: $v"; exit 0; }
            echo "attempt $i: got '${v:-no response}', waiting"; sleep 10
          done
          exit 1

name: CI

on:
  pull_request:

# Least privilege by default; jobs that need more ask for it.
permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm build # includes tsc type-check

  iac:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - run: terraform fmt -check -recursive infra
      - name: validate
        run: |
          for d in infra/bootstrap infra; do
            terraform -chdir=$d init -backend=false -input=false
            terraform -chdir=$d validate
          done
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0
      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }} # avoids rate limits when downloading the azurerm ruleset
        run: |
          tflint --init --config "$PWD/infra/.tflint.hcl"
          tflint --chdir infra --config "$PWD/infra/.tflint.hcl"
          tflint --chdir infra/bootstrap --config "$PWD/infra/.tflint.hcl"
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

  plan:
    needs: iac
    # Fork PRs get no OIDC token and no secrets, so plan can't run for them. Skip instead of failing.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # lets the job request a GitHub OIDC token, which Azure trades for an access token
      pull-requests: write # post the plan comment
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID_PLAN }} # read-only identity
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_budget_alert_email: ${{ secrets.BUDGET_ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - run: terraform -chdir=infra init -input=false -backend-config=storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}
      - name: plan
        id: plan
        continue-on-error: true
        # -lock=false: the plan identity can only read state, and locking is a write (a blob lease).
        run: terraform -chdir=infra plan -lock=false -input=false -no-color 2>&1 | tee plan.txt; exit "${PIPESTATUS[0]}"
      - name: comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### \`terraform plan\`: ${{ steps.plan.outcome }}"
            echo "<details><summary>Show plan</summary>"
            echo
            echo '```'
            tail -c 60000 plan.txt # PR comments max out at 65536 chars
            echo '```'
            echo "</details>"
          } > comment.md
          # Edit the bot's last comment instead of stacking one per push.
          gh pr comment ${{ github.event.pull_request.number }} --body-file comment.md --edit-last --create-if-none
      - if: steps.plan.outcome == 'failure'
        run: exit 1

name: CI

on:
  pull_request:

# Least privilege by default; jobs that need more ask for it.
permissions:
  contents: read

# A new push to a PR supersedes its earlier run; cancel that one instead of finishing it.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Each job runs one section of scripts/check.sh, the same command agents run locally.
  app:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: scripts/check.sh app

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Chromium's OS libraries; check.sh installs the browser itself.
      - run: corepack pnpm install --frozen-lockfile && corepack pnpm exec playwright install-deps chromium
        working-directory: app/web
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      - run: scripts/check.sh web
      # What Playwright saw, on the platform the baselines are recorded on: the baselines it wrote
      # or updated, and the actual/diff images of any failure (docs/agents/web-tests.md).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: web-screenshots
          path: |
            app/web/e2e/baselines
            app/web/test-results
          if-no-files-found: ignore

  iac:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Terraform and tflint run in the tf-toolbox image, so CI and local runs share its versions.
      - run: scripts/check.sh iac image
        env:
          GITHUB_TOKEN: ${{ github.token }} # avoids rate limits when tflint downloads the azurerm ruleset

  plan:
    needs: iac
    # Fork PRs get no OIDC token and no secrets, so plan can't run for them. Skip instead of failing.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # lets the job request a GitHub OIDC token, which Azure trades for an access token
      pull-requests: write # post the plan comment
    env:
      ARM_USE_OIDC: "true"
      # Secrets, not vars: GitHub masks secrets in logs, and this repo's logs are public.
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID_PLAN }} # read-only identity
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_budget_alert_email: ${{ secrets.BUDGET_ALERT_EMAIL }}
      TF_VAR_operator_object_id: ${{ secrets.AZURE_OPERATOR_OBJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - run: terraform -chdir=infra init -input=false -backend-config=storage_account_name=${{ secrets.TFSTATE_STORAGE_ACCOUNT }}
      - name: plan
        id: plan
        continue-on-error: true
        # -lock=false: the plan identity can only read state, and locking is a write (a blob lease).
        # Nothing reaches the log or the PR comment until scripts/redact.py has redacted it and
        # checked that no ARM_* value survived; if one did, it withholds the plan and fails the job.
        run: |
          rc=0
          terraform -chdir=infra plan -lock=false -input=false -no-color -out=tfplan > raw.txt 2>&1 || rc=$?
          python3 scripts/redact.py < raw.txt > plan.txt || rc=1
          rm raw.txt
          cat plan.txt
          exit "$rc"
      - name: risk
        id: risk
        if: steps.plan.outcome == 'success'
        # Same checker the terraform-operator subagent uses (scripts/tf_risk.py). Exit 2 = DANGER, 3 = BLOCK.
        # plan.json holds unredacted sensitive values, so it's never uploaded; risk.md has addresses only.
        run: |
          terraform -chdir=infra show -json tfplan > plan.json
          rc=0
          python3 scripts/tf_risk.py plan.json > risk.md || rc=$?
          cat risk.md
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
      # Plan can't see whether a region takes new Postgres servers: East US (restricted) only failed at
      # apply, on main (ADR-0002). Ask list-skus before merge, as the same read-only identity.
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        if: steps.plan.outcome == 'success'
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_PLAN }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: capacity
        id: capacity
        if: steps.plan.outcome == 'success'
        continue-on-error: true
        run: |
          rc=0
          python3 scripts/check_capacity.py plan.json > raw.txt 2>&1 || rc=$?
          python3 scripts/redact.py < raw.txt > capacity.txt || rc=1
          rm raw.txt
          cat capacity.txt
          exit "$rc"
      - name: comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### \`terraform plan\`: ${{ steps.plan.outcome }}"
            if [ "${{ steps.risk.outputs.rc }}" = 2 ]; then
              echo "> [!WARNING]"
              echo "> This plan deletes or replaces resources, and CD applies it as soon as this PR merges."
            elif [ "${{ steps.risk.outputs.rc }}" = 3 ]; then
              echo "> [!CAUTION]"
              echo "> Blocked: this plan deletes or replaces a protected resource. Change the code instead."
            fi
            [ -f risk.md ] && cat risk.md && echo
            if [ "${{ steps.capacity.outcome }}" = failure ]; then
              echo "> [!CAUTION]"
              echo "> A planned Postgres server can't be created in its region, so CD's apply would fail:"
              echo
              echo '```'
              cat capacity.txt
              echo '```'
            fi
            echo "<details><summary>Show plan</summary>"
            echo
            echo '```'
            tail -c 60000 plan.txt # PR comments max out at 65536 chars
            echo '```'
            echo "</details>"
          } > comment.md
          # Edit the bot's last comment instead of stacking one per push.
          gh pr comment ${{ github.event.pull_request.number }} --body-file comment.md --edit-last --create-if-none
      - if: steps.plan.outcome == 'failure' || steps.risk.outputs.rc == '3' || steps.capacity.outcome == 'failure'
        run: exit 1

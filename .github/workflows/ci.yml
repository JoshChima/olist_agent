name: CI

on:
  pull_request:

# Least privilege by default; jobs that need more ask for it.
permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest
      # Repo scripts and the toolbox installer: same ruff config, pyright in standard mode
      # (../pyrightconfig.json), since they walk untyped `terraform show -json` output.
      - run: uv run ruff check ../scripts ../tools
      - run: uv run ruff format --check ../scripts ../tools
      - run: uv run pyright -p ..

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm build # includes tsc type-check

  iac:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - run: terraform fmt -check -recursive infra
      - name: validate and test
        # terraform test uses mock providers (infra/**/tests/*.tftest.hcl), so it needs no Azure access.
        run: |
          for d in infra/bootstrap infra; do
            terraform -chdir=$d init -backend=false -input=false
            terraform -chdir=$d validate
            terraform -chdir=$d test
          done
      - name: risk checker and guard self-tests
        # The gates between agents and real Azure (ADR-0007): risk tiers, the apply gate,
        # the subagent's Bash guard and the apply approval hook.
        run: |
          python3 scripts/test_tf_risk.py
          python3 scripts/test_guards.py
      - name: shellcheck
        run: shellcheck scripts/*.sh # preinstalled on GitHub's ubuntu-24.04 image
      - name: workflows read Azure IDs from secrets
        # vars.* are never masked, so anything read from them lands in the public logs.
        run: "! grep -rnE '\\{\\{ *vars\\.' .github/workflows"
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0
      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }} # avoids rate limits when downloading the azurerm ruleset
        run: |
          tflint --init --config "$PWD/infra/.tflint.hcl"
          tflint --chdir infra --config "$PWD/infra/.tflint.hcl"
          tflint --chdir infra/bootstrap --config "$PWD/infra/.tflint.hcl"
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

  plan:
    needs: iac
    # Fork PRs get no OIDC token and no secrets, so plan can't run for them. Skip instead of failing.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # lets the job request a GitHub OIDC token, which Azure trades for an access token
      pull-requests: write # post the plan comment
    env:
      ARM_USE_OIDC: "true"
      # Secrets, not vars: GitHub masks secrets in logs, and this repo's logs are public.
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID_PLAN }} # read-only identity
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_budget_alert_email: ${{ secrets.BUDGET_ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - run: terraform -chdir=infra init -input=false -backend-config=storage_account_name=${{ secrets.TFSTATE_STORAGE_ACCOUNT }}
      - name: plan
        id: plan
        continue-on-error: true
        # -lock=false: the plan identity can only read state, and locking is a write (a blob lease).
        # Redact before anything reaches the log or the PR comment; masking only covers secrets.
        # 1. Drop the "[id=...]" on Reading/Refreshing lines: azurerm_client_config's id is the
        #    client, object, subscription and tenant IDs base64-encoded, so no GUID filter sees it.
        # 2. Replace every other GUID (principal and role-assignment IDs inside resource IDs).
        run: |
          terraform -chdir=infra plan -lock=false -input=false -no-color -out=tfplan 2>&1 |
            sed -E 's/ \[id=[^]]*\]//; s/[0-9a-fA-F]{8}(-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}/<guid>/g' | tee plan.txt
          exit "${PIPESTATUS[0]}"
      - name: risk
        id: risk
        if: steps.plan.outcome == 'success'
        # Same checker the terraform-operator subagent uses (scripts/tf_risk.py). Exit 2 = DANGER, 3 = BLOCK.
        # plan.json holds unredacted sensitive values, so it's never uploaded; risk.md has addresses only.
        run: |
          terraform -chdir=infra show -json tfplan > plan.json
          rc=0
          python3 scripts/tf_risk.py plan.json > risk.md || rc=$?
          cat risk.md
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
      - name: comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### \`terraform plan\`: ${{ steps.plan.outcome }}"
            if [ "${{ steps.risk.outputs.rc }}" = 2 ]; then
              echo "> [!WARNING]"
              echo "> This plan deletes or replaces resources, and CD applies it as soon as this PR merges."
            elif [ "${{ steps.risk.outputs.rc }}" = 3 ]; then
              echo "> [!CAUTION]"
              echo "> Blocked: this plan deletes or replaces a protected resource. Change the code instead."
            fi
            [ -f risk.md ] && cat risk.md && echo
            echo "<details><summary>Show plan</summary>"
            echo
            echo '```'
            tail -c 60000 plan.txt # PR comments max out at 65536 chars
            echo '```'
            echo "</details>"
          } > comment.md
          # Edit the bot's last comment instead of stacking one per push.
          gh pr comment ${{ github.event.pull_request.number }} --body-file comment.md --edit-last --create-if-none
      - if: steps.plan.outcome == 'failure' || steps.risk.outputs.rc == '3'
        run: exit 1
